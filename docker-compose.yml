services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticketing_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - ticketing
  nginx:
    image: nginx:alpine
    container_name: ticketing_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - ticketing

  mysql:
    image: mysql:8.0
    container_name: ticketing_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ticketing
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ticketing
      MYSQL_PASSWORD: ticketing
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ticketing
networks:
  ticketing:

volumes:
  mysql_data:
